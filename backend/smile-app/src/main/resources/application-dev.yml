spring:
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:h2:mem:smile_boss_ai;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  data:
    redis:
      repositories:
        enabled: false
